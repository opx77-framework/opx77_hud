<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPX77 HUD</title>
<link rel="stylesheet" href="open77-ui.css">
<link rel="stylesheet" href="hud.css">
</head>
<body>

<!-- Nothing focusable: this surface is on the "hud" layer and is never focused. -->
<div class="gauges" id="gauges"></div>
<ul class="info" id="info"></ul>

<!-- Status effects. opx77_status owns them; this surface draws them. -->
<div class="strip" id="strip"><ul class="chips" id="chips"></ul></div>

<!-- Voice: right edge, vertically centred. Open77's voice stack owns the state; this draws it. -->
<div class="voice state-offline" id="voice">
  <span class="voice-mic">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 10.2a2.5 2.5 0 0 0 2.5-2.5V4.1a2.5 2.5 0 1 0-5 0v3.6A2.5 2.5 0 0 0 8 10.2Z"/>
      <path d="M3.9 7.2v.5a4.1 4.1 0 0 0 8.2 0v-.5M8 11.8v2.4M5.9 14.2h4.2"/>
    </svg>
    <i class="voice-slash"></i>
  </span>
  <span class="voice-caption" id="voice-caption"></span>
  <span class="voice-meter" id="voice-meter"></span>
  <span class="voice-mode" id="voice-mode"></span>
  <span class="voice-distance" id="voice-distance"></span>
  <span class="voice-pips" id="voice-pips"></span>
  <span class="voice-keys">
    <kbd class="voice-key" id="voice-key"></kbd>
    <kbd class="voice-key ptt" id="voice-ptt"></kbd>
  </span>
  <span class="voice-heard" id="voice-heard"><i></i><b id="voice-heard-count"></b></span>
</div>

<!-- Vehicle: a round dial, shown only while the character sits in one.
     Outer ring: engine speed, red past the redline. Inner ring: integrity. -->
<div class="vehicle anchor-bottom-center" id="vehicle">
  <div class="vehicle-dial">
    <svg class="vehicle-rings" viewBox="0 0 120 120" aria-hidden="true">
      <path class="ring-track" d="M23.2 96.8A52 52 0 1 1 96.8 96.8" pathLength="100"/>
      <path class="ring-redline" d="M23.2 96.8A52 52 0 1 1 96.8 96.8" pathLength="100"/>
      <path class="ring-rpm" id="vehicle-rpm" d="M23.2 96.8A52 52 0 1 1 96.8 96.8" pathLength="100"/>
      <path class="ring-inner-track" d="M29 91A44 44 0 1 1 91 91" pathLength="100"/>
      <path class="ring-integrity" id="vehicle-integrity-ring" d="M29 91A44 44 0 1 1 91 91" pathLength="100"/>
    </svg>
    <div class="vehicle-core">
      <span class="vehicle-speed" id="vehicle-speed">0</span>
      <span class="vehicle-unit" id="vehicle-unit"></span>
      <span class="vehicle-gear" id="vehicle-gear">N</span>
    </div>
  </div>
  <div class="vehicle-meta">
    <span class="vehicle-integrity" id="vehicle-integrity-row">
      <span class="vehicle-label" id="vehicle-integrity-label"></span>
      <b id="vehicle-integrity"></b>
    </span>
    <span class="vehicle-air" id="vehicle-air"></span>
  </div>
</div>

<script src="hud.js"></script>
</body>
</html>
